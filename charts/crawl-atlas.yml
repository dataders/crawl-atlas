title: Crawl Atlas — Character Progression
notes: >
  Source-anchored, spoiler-conscious analysis of explicit levels, reported
  stats, named skills, inventory events, and recurring-cast relationships.

variables:
  characters:
    options:
      query: character_options
      column: character
    default: [Carl]
  metric:
    options:
      static: [Level, STR, INT, CON, DEX, CHA]
    default: Level
  through_book:
    min: 1
    max: 8
    step: 1
    default: 1
  through_chapter:
    min: 1
    max: 98
    step: 1
    default: 1

queries:
  character_options:
    source: crawl_atlas
    sql: |
      SELECT DISTINCT character
      FROM events
      WHERE character IS NOT NULL
        AND (book < {{ through_book }} OR
          (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
      ORDER BY character

  selected_roster:
    source: crawl_atlas
    sql: |
      WITH tracked_characters AS (
        SELECT DISTINCT character
        FROM progression
        WHERE character IS NOT NULL
          AND (book < {{ through_book }} OR
            (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
      )
      SELECT
        tracked.character,
        'Tracked cast' AS roster_group,
        COALESCE((
          SELECT action
          FROM events
          WHERE kind = 'party'
            AND character = tracked.character
            AND (book < {{ through_book }} OR
              (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
          ORDER BY progress DESC
          LIMIT 1
        ), 'observed') AS relationship,
        'Tracked character' AS role,
        (
          SELECT CAST(value AS INTEGER)
          FROM progression
          WHERE kind = 'level'
            AND character = tracked.character
            AND value IS NOT NULL
            AND (book < {{ through_book }} OR
              (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
          ORDER BY progress DESC
          LIMIT 1
        ) AS latest_confirmed_level
      FROM tracked_characters AS tracked
      WHERE {{ filter('tracked.character', characters) }}
      ORDER BY tracked.character

  headline:
    source: crawl_atlas
    sql: |
      SELECT
        COUNT(*) AS confirmed_points,
        COUNT(DISTINCT character) AS represented_characters,
        MAX(book) AS latest_book
      FROM progression
      WHERE {{ filter('character', characters) }}
        AND CASE WHEN kind = 'level' THEN 'Level' ELSE metric END = {{ metric }}
        AND (book < {{ through_book }} OR
          (book = {{ through_book }} AND chapter <= {{ through_chapter }}))

  metric_progression:
    source: crawl_atlas
    sql: |
      SELECT
        progress * 100 AS series_progress,
        book,
        chapter,
        character,
        CASE
          WHEN kind = 'level' THEN character
          ELSE character || ' · ' || COALESCE(scope, 'reported')
        END AS series,
        value,
        scope,
        summary
      FROM progression
      WHERE {{ filter('character', characters) }}
        AND CASE WHEN kind = 'level' THEN 'Level' ELSE metric END = {{ metric }}
        AND value IS NOT NULL
        AND (book < {{ through_book }} OR
          (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
      ORDER BY progress, character

  selected_skills:
    source: crawl_atlas
    sql: |
      SELECT
        character,
        metric AS skill,
        CAST(value AS INTEGER) AS level,
        'Book ' || book || ', Ch. ' || chapter AS confirmed_at,
        summary AS detail
      FROM progression
      WHERE {{ filter('character', characters) }}
        AND kind = 'skill'
        AND (book < {{ through_book }} OR
          (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
      ORDER BY character, metric, progress

  selected_inventory:
    source: crawl_atlas
    sql: |
      SELECT
        character,
        name AS item,
        action,
        json_extract(payload, '$.state') AS state,
        CAST(json_extract(payload, '$.quantity') AS INTEGER) AS quantity,
        'Book ' || book || ', Ch. ' || chapter AS event_at
      FROM events
      WHERE {{ filter('character', characters) }}
        AND kind = 'item'
        AND (book < {{ through_book }} OR
          (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
      ORDER BY progress DESC

  selected_relationships:
    source: crawl_atlas
    sql: |
      SELECT
        character,
        action AS relationship,
        'Book ' || book || ', Ch. ' || chapter AS changed_at,
        summary
      FROM events
      WHERE {{ filter('character', characters) }}
        AND kind = 'party'
        AND (book < {{ through_book }} OR
          (book = {{ through_book }} AND chapter <= {{ through_chapter }}))
      ORDER BY progress

charts:
  points_kpi:
    type: kpi
    query: headline
    label: Confirmed points
    value: confirmed_points
    style:
      value:
        format: integer

  characters_kpi:
    type: kpi
    query: headline
    label: Characters represented
    value: represented_characters
    style:
      value:
        format: integer

  book_kpi:
    type: kpi
    query: headline
    label: Latest book in view
    value: latest_book
    style:
      value:
        format: integer

  progression:
    type: line
    query: metric_progression
    warnings_ignore: [WARN-QUERY-RETURNED-ZERO-ROWS]
    title: Explicit progression milestones
    subtitle: Gaps stay visible; missing levels and stats are never interpolated as facts.
    x: series_progress
    y: value
    color: series

  roster:
    type: table
    query: selected_roster
    warnings_ignore: [WARN-QUERY-RETURNED-ZERO-ROWS]
    title: Selected cast
    style:
      columns:
        roster_group:
          label: Group

  skills:
    type: table
    query: selected_skills
    warnings_ignore: [WARN-QUERY-RETURNED-ZERO-ROWS]
    title: Named skills and spells
    subtitle: Latest and repeated confirmations remain visible as separate sourced rows.
    style:
      columns:
        level:
          format: integer

  inventory:
    type: table
    query: selected_inventory
    title: Inventory event log
    subtitle: Acquisitions, uses, equipment changes, and removals—not a guessed current balance.
    style:
      columns:
        quantity:
          format: integer

  relationships:
    type: table
    query: selected_relationships
    warnings_ignore: [WARN-QUERY-RETURNED-ZERO-ROWS]
    title: Party and alliance history

tabs:
  items:
    - title: Progression
      rows:
        - text: |
            Showing **{{ metric }}** for selected characters through
            **Book {{ through_book }}, Chapter {{ through_chapter }}**.
            Every plotted value is explicitly stated in the books; source gaps stay gaps.
        - cols: [points_kpi, characters_kpi, book_kpi]
        - progression
        - roster
        - relationships
    - title: Skills
      rows: [skills]
    - title: Inventory
      rows: [inventory]
