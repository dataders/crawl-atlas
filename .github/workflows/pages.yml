name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/dist/**"
      - "scripts/render_reader_charts.py"
      - "scripts/reader_book_axis.py"
      - "scripts/detail_rows.cjs"
      - "scripts/render_detail_tables.py"
      - "scripts/check_reader_exports.py"
      - "charts/reader-exports.json"
      - "dbt_charts.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: astral-sh/setup-uv@v6
      - name: Verify reader exports before upload
        run: uv run python scripts/check_reader_exports.py

      - name: Prepare current reader assets
        run: rsync -a --exclude='/reader-charts/' site/dist/ "${RUNNER_TEMP}/crawl-atlas-pages/"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/crawl-atlas-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
