name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/dist/**"
      - "scripts/build_single_board.py"
      - "scripts/export_single_board.py"
      - "scripts/check_single_board.py"
      - "charts/reader.yml"
      - "scripts/render_reader_charts.py"
      - "scripts/render_dossier_charts.py"
      - "scripts/render_skill_charts.py"
      - "data/public/stat-breakdown-audit.json"
      - "scripts/reader_book_axis.py"
      - "scripts/detail_rows.cjs"
      - "scripts/render_detail_tables.py"
      - "scripts/check_reader_exports.py"
      - "charts/reader-exports.json"
      - "dbt_charts.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: astral-sh/setup-uv@v6
      - name: Verify reader exports before upload
        run: uv run python scripts/check_single_board.py

      - name: Prepare current reader assets
        run: |
          mkdir -p "${RUNNER_TEMP}/crawl-atlas-pages/data"
          cp site/dist/index.html site/dist/styles.css site/dist/about.css site/dist/static-reader.js site/dist/CNAME "${RUNNER_TEMP}/crawl-atlas-pages/"
          cp site/dist/data/reader-board.json site/dist/data/spoiler-free.json "${RUNNER_TEMP}/crawl-atlas-pages/data/"
          mkdir -p "${RUNNER_TEMP}/crawl-atlas-pages/charts/compact"
          cp site/dist/charts/spoiler-free-*.html "${RUNNER_TEMP}/crawl-atlas-pages/charts/"
          cp site/dist/charts/compact/spoiler-free-*.html "${RUNNER_TEMP}/crawl-atlas-pages/charts/compact/"
          cp -R site/dist/branding site/dist/boards site/dist/board-assets "${RUNNER_TEMP}/crawl-atlas-pages/"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/crawl-atlas-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000 # Allow 30 minutes to sync the reader exports.
