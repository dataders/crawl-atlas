name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate curated data
        run: uv run python3 scripts/validate_data.py site/dist/data/book-1.json
      - name: Run tests
        run: uv run python3 -m unittest discover -s tests
      - name: Check browser JavaScript
        run: node --check site/dist/app.js
